# Default values for smart-grocery
# This is a YAML-formatted file.

# Global settings
global:
  namespace: smart-grocery

# Redis configuration
redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  persistence:
    enabled: true
    storageClass: manual
    size: 1Gi
  service:
    type: ClusterIP
    port: 6379

# Server (Backend) configuration
server:
  enabled: true
  image:
    repository: smart-grocery-server
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 2
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  env:
    nodeEnv: production
    redisUrl: "redis://redis:6379"
  service:
    type: ClusterIP
    port: 5000
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  livenessProbe:
    httpGet:
      path: /items
      port: 5000
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /items
      port: 5000
    initialDelaySeconds: 10
    periodSeconds: 5

# Client (Frontend) configuration  
client:
  enabled: true
  image:
    repository: smart-grocery-client
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 2
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  service:
    type: LoadBalancer
    port: 80
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  livenessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 5

# Ingress configuration
ingress:
  enabled: false
  className: nginx
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: smart-grocery.local
      paths:
        - path: /
          pathType: Prefix
          service: client
        - path: /api
          pathType: Prefix
          service: server
  tls: []
    # - secretName: smart-grocery-tls
    #   hosts:
    #     - smart-grocery.local

# ConfigMap data
configMap:
  data:
    REDIS_URL: "redis://redis:6379"
    NODE_ENV: "production"
    API_BASE_URL: "/api"
