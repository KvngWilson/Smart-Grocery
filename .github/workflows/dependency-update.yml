name: Dependency Updates

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  update-dependencies:
    name: Check for Dependency Updates
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check frontend outdated packages
        run: |
          npm outdated > outdated-frontend.txt || true
          cat outdated-frontend.txt

      - name: Check backend outdated packages
        working-directory: ./server
        run: |
          npm outdated > ../outdated-backend.txt || true
          cat ../outdated-backend.txt

      - name: Create issue for updates
        if: hashFiles('outdated-frontend.txt') != '' || hashFiles('outdated-backend.txt') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## 📦 Dependency Updates Available\n\n';
            
            try {
              const frontendOutdated = fs.readFileSync('outdated-frontend.txt', 'utf8');
              if (frontendOutdated.trim()) {
                body += '### Frontend Dependencies\n\n```\n' + frontendOutdated + '\n```\n\n';
              }
            } catch (e) {}
            
            try {
              const backendOutdated = fs.readFileSync('outdated-backend.txt', 'utf8');
              if (backendOutdated.trim()) {
                body += '### Backend Dependencies\n\n```\n' + backendOutdated + '\n```\n\n';
              }
            } catch (e) {}
            
            body += '\nRun `npm update` to update dependencies.\n';
            body += '\n**⚠️ Note:** Review breaking changes before updating major versions.';
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Dependency Updates Available - ' + new Date().toISOString().split('T')[0],
              body: body,
              labels: ['dependencies', 'maintenance']
            });

  dependabot-auto-merge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Approve and merge minor/patch updates
        run: |
          # This is a placeholder - configure according to your needs
          echo "Auto-merge logic for minor/patch updates"
