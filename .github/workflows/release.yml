name: Release Management

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            echo "changelog=First release" >> $GITHUB_OUTPUT
          else
            CHANGELOG=$(git log $PREV_TAG..HEAD --pretty=format:"- %s (%an)" --no-merges)
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGELOG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          release_name: Release ${{ steps.get_version.outputs.version }}
          body: |
            ## Changes in this Release
            
            ${{ steps.changelog.outputs.changelog }}
            
            ## Docker Images
            
            ```bash
            # Pull images
            docker pull gcr.io/${{ secrets.GCP_PROJECT_ID }}/smart-grocery-server:${{ steps.get_version.outputs.version }}
            docker pull gcr.io/${{ secrets.GCP_PROJECT_ID }}/smart-grocery-client:${{ steps.get_version.outputs.version }}
            ```
            
            ## Deployment
            
            ```bash
            # Deploy to GKE
            kubectl set image deployment/server server=gcr.io/${{ secrets.GCP_PROJECT_ID }}/smart-grocery-server:${{ steps.get_version.outputs.version }} -n smart-grocery
            kubectl set image deployment/client client=gcr.io/${{ secrets.GCP_PROJECT_ID }}/smart-grocery-client:${{ steps.get_version.outputs.version }} -n smart-grocery
            ```
          draft: false
          prerelease: false

  build-release-images:
    name: Build Release Images
    runs-on: ubuntu-latest
    needs: create-release
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push server release image
        uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            gcr.io/${{ secrets.GCP_PROJECT_ID }}/smart-grocery-server:${{ steps.get_version.outputs.version }}
            gcr.io/${{ secrets.GCP_PROJECT_ID }}/smart-grocery-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push client release image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.client
          push: true
          tags: |
            gcr.io/${{ secrets.GCP_PROJECT_ID }}/smart-grocery-client:${{ steps.get_version.outputs.version }}
            gcr.io/${{ secrets.GCP_PROJECT_ID }}/smart-grocery-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
