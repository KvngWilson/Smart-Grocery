name: Docker Compose - Integration Test

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'docker-compose*.yml'
      - 'server/**'
      - 'src/**'
      - 'Dockerfile.*'
  pull_request:
    branches: [ main, develop ]

jobs:
  docker-compose-test:
    name: Test Docker Compose Setup
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start services with Docker Compose
        run: docker-compose -f docker-compose.dev.yml up -d --build

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to be ready..."
          timeout 120 bash -c 'until docker-compose -f docker-compose.dev.yml ps | grep -q "healthy"; do sleep 2; done' || exit 1

      - name: Check service health
        run: |
          docker-compose -f docker-compose.dev.yml ps
          docker-compose -f docker-compose.dev.yml logs

      - name: Test Redis connection
        run: |
          docker-compose -f docker-compose.dev.yml exec -T redis redis-cli ping

      - name: Test server API
        run: |
          curl -f http://localhost:5001/api/items || exit 1

      - name: Test frontend
        run: |
          curl -f http://localhost:8080 || exit 1

      - name: Run integration tests
        run: |
          # Add item
          curl -X POST http://localhost:5001/api/items \
            -H "Content-Type: application/json" \
            -d '{"item":"Test Item"}' || exit 1
          
          # Get items
          ITEMS=$(curl -s http://localhost:5001/api/items)
          echo "Items: $ITEMS"
          
          # Verify item exists
          echo "$ITEMS" | grep -q "Test Item" || exit 1

      - name: Stop services
        if: always()
        run: docker-compose -f docker-compose.dev.yml down -v

      - name: Show logs on failure
        if: failure()
        run: docker-compose -f docker-compose.dev.yml logs
