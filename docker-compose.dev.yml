version: '3.8'

# Development configuration with exposed ports for debugging
# Use this if you need to access Redis directly from your host machine

services:
  redis:
    image: redis:7-alpine
    container_name: smart-grocery-redis-dev
    ports:
      - "6380:6379"  # Map to port 6380 to avoid conflicts
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart-grocery-network

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: smart-grocery-server-dev
    ports:
      - "5001:5000"  # Map to port 5001 to avoid conflicts
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - smart-grocery-network
    restart: unless-stopped
    volumes:
      - ./server:/app  # Mount for hot-reload in development
      - /app/node_modules

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: smart-grocery-client-dev
    ports:
      - "8080:80"  # Map to port 8080 to avoid conflicts
    depends_on:
      - server
    networks:
      - smart-grocery-network
    restart: unless-stopped

volumes:
  redis_data_dev:
    driver: local

networks:
  smart-grocery-network:
    driver: bridge
