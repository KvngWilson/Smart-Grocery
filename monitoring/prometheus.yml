global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'smart-grocery-local'
    environment: 'development'

rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Smart Grocery Server
  - job_name: 'smart-grocery-server'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['server:5000']
        labels:
          app: 'server'
          service: 'smart-grocery'

  # Redis Exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          app: 'redis'
          service: 'smart-grocery'
